[package]
name = "vmx"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "MIT"
description = "Pure Rust VMX1 video codec"
authors = ["MikanseiLaboratory"]
readme = "README.md"

[lib]
name = "vmx"
path = "src/lib.rs"

[features]
default = []
wgpu = ["dep:wgpu", "dep:bytemuck", "dep:pollster"]

[dependencies]
thiserror = "2"
rayon = "1.10"
wgpu = { version = "30.0.0", optional = true, default-features = true }
bytemuck = { version = "1", optional = true, features = ["derive"] }
pollster = { version = "0.4", optional = true }

[dev-dependencies]
pollster = "0.4"

[[example]]
name = "roundtrip"

[[example]]
name = "simd_report"

[[example]]
name = "gpu_bench"
required-features = ["wgpu"]

[profile.release]
lto = "thin"
codegen-units = 1
opt-level = 3

# Even more aggressive local profiling builds:
#   RUSTFLAGS="-C target-cpu=native" cargo build --profile release-fast
[profile.release-fast]
inherits = "release"
lto = "fat"
strip = "symbols"
