# Publishes the crates.io package `vmx1` when a version tag is pushed.
# Trusted Publishing (https://crates.io/docs/trusted-publishing), after 0.1.0
# exists on crates.io:
#   owner: MikanseiLaboratory
#   repository: vmx-rs
#   workflow filename: publish.yml
#   environment: (leave empty)

name: Publish

on:
  push:
    tags: ["v[0-9]*"]

env:
  CARGO_TERM_COLOR: always

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97"
      - name: Check tag matches crate version
        run: |
          version="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')"
          tag="${GITHUB_REF_NAME#v}"
          if [ "$version" != "$tag" ]; then
            echo "tag ${GITHUB_REF_NAME} does not match Cargo.toml version ${version}" >&2
            exit 1
          fi
      - uses: rust-lang/crates-io-auth-action@v1
        id: auth
      - run: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
