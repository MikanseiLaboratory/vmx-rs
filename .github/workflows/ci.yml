name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97"
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97"
          components: clippy
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  # Optional nightly portable SIMD path (`std::simd`).
  portable-simd-nightly:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: clippy, rustfmt
      - run: cargo +nightly fmt --all -- --check
      - run: cargo +nightly clippy --features portable-simd --all-targets -- -D warnings -A clippy::chunks_exact_to_as_chunks
      - run: cargo +nightly test --features portable-simd
      - run: cargo +nightly test --release --features portable-simd --lib -- portable

  # Optional nightly AArch64 SVE/SVE2 (cross-compile + detect on ARM runners).
  sve-nightly-aarch64:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@nightly
        with:
          targets: aarch64-unknown-linux-gnu
          components: clippy
      - run: cargo +nightly clippy --features sve --all-targets -- -D warnings -A clippy::chunks_exact_to_as_chunks
      - run: cargo +nightly test --features sve
      - name: Report SVE capability
        run: |
          cargo +nightly run --quiet --features sve --example simd_report -- 64 64 1 auto auto | head -5 || true
