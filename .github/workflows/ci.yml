name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97"
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97"
          components: clippy
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  clippy-test-wgpu:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97"
          components: clippy
      - run: cargo clippy --all-targets --features wgpu -- -D warnings
      - run: cargo test --features wgpu
      # settle_q runs 60 2160p encode+save frames per case and is minutes in
      # debug; run it in release so it stays practical.
      - run: cargo test --release --features wgpu --test settle_q
