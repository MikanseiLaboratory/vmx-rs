# Cross-ISA SIMD path benchmarks on GitHub-hosted runners.
#
# Compares scalar / arch (AVX2, SSE128, NEON) / optional portable (`std::simd`)
# on the same machine. Numbers are noisy on shared VMs — compare within a job.
#
# AVX-512: hosted runners do not reliably provide it, and vmx-rs has no AVX-512
# kernels yet. The workflow only *reports* whether avx512f is present.

name: SIMD bench

on:
  pull_request:
    paths:
      - "src/simd/**"
      - "src/color/**"
      - "src/codec/**"
      - "examples/simd_report.rs"
      - "scripts/simd_bench_matrix.sh"
      - ".github/workflows/simd-bench.yml"
      - "Cargo.toml"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/simd/**"
      - "src/color/**"
      - "examples/simd_report.rs"
      - "scripts/simd_bench_matrix.sh"
      - ".github/workflows/simd-bench.yml"

env:
  CARGO_TERM_COLOR: always
  # Keep CI runtime modest (1080p, few iters). Bump via workflow_dispatch inputs later if needed.
  BENCH_W: "1920"
  BENCH_H: "1080"
  BENCH_ITERS: "10"

jobs:
  bench:
    name: bench (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux x86_64 — typically AVX2 (+ sometimes AVX-512 flags in cpuinfo).
          - name: ubuntu-x64-avx2
            os: ubuntu-latest
            portable: "1"
          # Linux ARM64 — NEON / ASIMD.
          - name: ubuntu-arm64-neon
            os: ubuntu-24.04-arm
            portable: "1"
          # macOS Apple Silicon — NEON.
          - name: macos-arm64-neon
            os: macos-latest
            portable: "1"
          # macOS Intel — AVX2 when available (paid/standard intel label).
          - name: macos-x64-avx2
            os: macos-15-intel
            portable: "1"

    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.os == 'macos-15-intel' || matrix.os == 'ubuntu-24.04-arm' }}
    steps:
      - uses: actions/checkout@v5

      - name: Install stable (1.97)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97"

      - name: Install nightly (portable-simd)
        if: matrix.portable == '1'
        uses: dtolnay/rust-toolchain@nightly

      - name: Detect CPU flags
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "## Runner: ${{ matrix.name }} (\`${{ matrix.os }}\`)"
            echo
            uname -srm
            if [[ -f /proc/cpuinfo ]]; then
              grep -m1 'model name' /proc/cpuinfo || true
              echo
              echo '### /proc/cpuinfo flags (filtered)'
              FLAGS=$(grep -m1 '^flags' /proc/cpuinfo | cut -d: -f2- || true)
              for f in sse2 ssse3 sse4_1 sse4_2 avx avx2 bmi1 bmi2 avx512f avx512dq avx512bw avx512vl; do
                if grep -qw "$f" <<<"$FLAGS"; then echo "- $f: **yes**"; else echo "- $f: no"; fi
              done
              if grep -qw avx512f <<<"$FLAGS"; then
                echo
                echo "> AVX-512 flags present on this VM, but vmx-rs has no AVX-512 kernels yet (informational only)."
              else
                echo
                echo "> No AVX-512 on this runner (typical for GitHub-hosted)."
              fi
            elif command -v sysctl >/dev/null; then
              sysctl machdep.cpu.brand_string hw.physicalcpu hw.logicalcpu 2>/dev/null || true
              sysctl hw.optional.avx2_0 hw.optional.avx512f hw.optional.sse4_2 hw.optional.AdvSIMD 2>/dev/null || true
            fi
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Stable arch paths (no portable feature)
        shell: bash
        run: |
          set -euo pipefail
          chmod +x scripts/simd_bench_matrix.sh
          export SIMD_BENCH_MD="simd-bench-stable.md"
          export SIMD_BENCH_DIR="simd-bench-out/stable"
          CARGO="cargo" FEATURES="" \
            ./scripts/simd_bench_matrix.sh "$BENCH_W" "$BENCH_H" "$BENCH_ITERS"

      - name: Nightly portable-simd paths
        if: matrix.portable == '1'
        shell: bash
        run: |
          set -euo pipefail
          export SIMD_BENCH_MD="simd-bench-portable.md"
          export SIMD_BENCH_DIR="simd-bench-out/portable"
          CARGO="cargo +nightly" FEATURES="--features portable-simd" \
            ./scripts/simd_bench_matrix.sh "$BENCH_W" "$BENCH_H" "$BENCH_ITERS"

      - name: Microkernel release tests (portable vs scalar)
        if: matrix.portable == '1'
        shell: bash
        run: |
          set -euo pipefail
          # Soft gate: report timings even if a host is only marginally faster.
          set +e
          cargo +nightly test --release --features portable-simd --lib -- --nocapture \
            idct_portable_faster portable_bgra_faster avx512_idct_faster 2>&1 | tee micro-portable.txt
          rc=${PIPESTATUS[0]}
          set -e
          {
            echo
            echo "## Microkernel timings"
            echo
            echo '```'
            grep -E 'idct|yuv422' micro-portable.txt || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          # Only fail the job if tests panicked for reasons other than speed gates —
          # speed assertions are informational across noisy CI VMs / macOS Intel.
          if grep -q 'portable IDCT should be faster' micro-portable.txt; then
            echo "Note: portable IDCT speed gate soft-failed on this host (timings above)."
            exit 0
          fi
          exit "$rc"

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: simd-bench-${{ matrix.name }}
          path: |
            simd-bench-out/
            simd-bench-stable.md
            simd-bench-portable.md
            micro-portable.txt
          if-no-files-found: ignore
