[package]
name = "vmx"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "MIT"
description = "Pure Rust VMX1 video codec"
authors = ["MikanseiLaboratory"]
readme = "README.md"

[lib]
name = "vmx"
path = "src/lib.rs"

[features]
default = []
# Nightly-only portable SIMD path (`std::simd`). Requires:
#   rustup run nightly cargo build --features portable-simd
portable-simd = []
# Nightly-only AArch64 SVE/SVE2 path (`stdarch_aarch64_sve`). Requires:
#   rustup run nightly cargo build --features sve --target aarch64-unknown-linux-gnu
sve = []

[dependencies]
thiserror = "2"
rayon = "1.10"

[[example]]
name = "roundtrip"

[[example]]
name = "simd_report"

[profile.release]
lto = "thin"
codegen-units = 1
opt-level = 3

# Even more aggressive local profiling builds:
#   RUSTFLAGS="-C target-cpu=native" cargo build --profile release-fast
[profile.release-fast]
inherits = "release"
lto = "fat"
strip = "symbols"
